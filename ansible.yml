# УСТАНОВКА NODE_EXPORTER НА ВСЕ ХОСТЫ
    - name: Install node_exporter on all hosts
      raw: |
        echo "=== Installing node_exporter on {{ inventory_hostname }} ==="
        
        # Скачиваем node_exporter
        cd /tmp
        wget -q https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
        tar -xzf node_exporter-1.7.0.linux-amd64.tar.gz
        
        # Устанавливаем
        sudo mv node_exporter-1.7.0.linux-amd64/node_exporter /usr/local/bin/
        sudo chmod +x /usr/local/bin/node_exporter
        
        # Создаем пользователя для node_exporter
        sudo useradd -rs /bin/false node_exporter || true
        
        # Создаем systemd сервис
        sudo tee /etc/systemd/system/node_exporter.service > /dev/null << EOF
        [Unit]
        Description=Node Exporter
        After=network.target
        
        [Service]
        User=node_exporter
        Group=node_exporter
        Type=simple
        ExecStart=/usr/local/bin/node_exporter
        
        [Install]
        WantedBy=multi-user.target
        EOF
        
        # Запускаем сервис
        sudo systemctl daemon-reload
        sudo systemctl enable node_exporter
        sudo systemctl start node_exporter
        
        sleep 2
        if systemctl is-active --quiet node_exporter; then
          echo "✅ node_exporter started on {{ inventory_hostname }}, listening on port 9100"
        else
          echo "❌ Failed to start node_exporter on {{ inventory_hostname }}"
          exit 1
        fi
      become: yes
      register: node_exporter_install

     # ЗАПУСК JMETER ТЕСТА С ОТОБРАЖЕНИЕМ ПРОГРЕССА
    - name: Run JMeter test
      raw: |
        EXTRACT_DIR="{{ jmeter_remote_test_dir | default('/opt/jmeter_tests') }}"
        JMX_FILE=$(find "$EXTRACT_DIR" -name "*.jmx" -type f | head -1)
        RESULTS_DIR="{{ jmeter_results_remote_dir | default('/tmp/jmeter_results') }}"
        TEST_DURATION="{{ test_duration | default(300) }}"
        
        # Получаем список хостов для теста
        TARGET_HOSTS=""
        for host in {{ groups['webservers'] | join(' ') }}; do
          if [ "$host" != "{{ jmeter_host }}" ]; then
            TARGET_HOSTS="$TARGET_HOSTS $host"
          fi
        done
        
        mkdir -p "$RESULTS_DIR"
        
        # Определяем переменные
        FILE_SERVER=$(echo $TARGET_HOSTS | awk '{print $1}')
        URL=$(echo $TARGET_HOSTS | awk '{print $2}')
        URL1=$(echo $TARGET_HOSTS | awk '{print $3}')
        
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        RESULT_FILE="$RESULTS_DIR/result_${TIMESTAMP}.jtl"
        STATUS_FILE="$RESULTS_DIR/test_status.txt"
        
        echo "RUNNING" > "$STATUS_FILE"
        echo "START_TIME=$(date +%s)" >> "$STATUS_FILE"
        echo "TEST_DURATION=$TEST_DURATION" >> "$STATUS_FILE"
        
        echo "=== Starting JMeter test ==="
        echo "Test ID: $TIMESTAMP"
        echo "Target hosts: $TARGET_HOSTS"
        echo "Test duration: $TEST_DURATION seconds"
        echo "Start time: $(date)"
        
        # Запускаем тест
        timeout $TEST_DURATION jmeter -n \
          -t "$JMX_FILE" \
          -l "$RESULT_FILE" \
          -Jfile_server=$FILE_SERVER \
          -Jurl=$URL \
          -Jurl1=$URL1 \
          -JDuration=$TEST_DURATION | while read line; do
            echo "[JMETER] $line"
            if echo "$line" | grep -q "summary ="; then
              echo "📊 $line"
            fi
          done
        
        EXIT_CODE=$?
        END_TIME=$(date +%s)
        
        if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 124 ]; then
          echo "COMPLETED" > "$STATUS_FILE"
          echo "✅ JMeter test completed successfully"
        else
          echo "FAILED" > "$STATUS_FILE"
          echo "❌ JMeter test failed with exit code: $EXIT_CODE"
          exit $EXIT_CODE
        fi
        
        echo "END_TIME=$(date +%s)" >> "$STATUS_FILE"
        echo "RESULT_FILE=$RESULT_FILE" >> "$STATUS_FILE"
        echo "Test completed at: $(date)"
      delegate_to: "{{ jmeter_host }}"
      register: jmeter_run
      run_once: true
      become: yes
      when: jmeter_host is defined

    # ОТОБРАЖЕНИЕ СТАТУСА ЗАВЕРШЕНИЯ (без использования ansible_date_time)
    - name: Display test completion status
      debug:
        msg: "✅ JMeter test completed"
      run_once: true
      when: jmeter_host is defined

    # ПОКАЗАТЬ ВРЕМЯ ЗАВЕРШЕНИЯ ИЗ ВЫВОДА ТЕСТА
    - name: Show test completion time
      debug:
        var: jmeter_run.stdout_lines[-5:]
      run_once: true
      when: jmeter_host is defined and jmeter_run.stdout is defined