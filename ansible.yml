        # 3. ПРОВЕРКА НАЛИЧИЯ ПАКЕТОВ
        - name: Ensure required packages are installed
          raw: |
            missing_pkgs=""
            for cmd in rsync bzip2 tar sshpass; do
              if ! command -v $cmd >/dev/null 2>&1; then
                missing_pkgs="$missing_pkgs $cmd"
              fi
            done
            
            if [ -n "$missing_pkgs" ]; then
              echo "Installing missing packages: $missing_pkgs"
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y $missing_pkgs
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y $missing_pkgs
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y $missing_pkgs
              else
                echo "ERROR: Cannot install packages automatically: $missing_pkgs" >&2
                exit 1
              fi
            else
              echo "All required packages are already installed"
            fi
          register: package_install
          changed_when: false
          become: yes

