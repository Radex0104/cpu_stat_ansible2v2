---
- name: Deploy and execute script on webservers
  hosts: webservers
  gather_facts: no
  vars:
    script_name: "installer2.py"

    archive_src: "/mnt/c/Users/Daniil/Desktop/111/rplm_astra17_2025.4.1.1-VNF_134607.tar.bz2"
    
    # Получаем имена файлов из исходных путей
    
    archive_filename: "{{ archive_src | basename }}"

    # Пути на целевой машине
    archive_dest: "/tmp/{{ archive_filename }}"
    
    # Директория для распаковки (на одном уровне с архивом)
    extract_dir: "/tmp"
    
    result_dir: "/tmp/cpu_stat_results"
    
    # Параметры rsync
    rsync_extra_opts: '--partial --progress --compress --checksum'
    rsync_timeout: 3600

  tasks:
    # 0. ДОБАВЛЕНИЕ ХОСТА В KNOWN_HOSTS
    - name: Add host to known_hosts
      known_hosts:
        path: ~/.ssh/known_hosts
        name: "{{ inventory_hostname }}"
        key: "{{ lookup('pipe', 'ssh-keyscan ' + inventory_hostname) }}"
      delegate_to: localhost
      run_once: true
      when: ansible_user is defined
      ignore_errors: yes

    # 1. ТЕСТ СОЕДИНЕНИЯ
    - name: Gather basic host information
      raw: |
        echo "=== Host: $(hostname) ==="
        echo "IP: $(ip route get 1 | awk '{print $NF;exit}')"
        echo "Date: $(date)"
        echo "Free disk space on /tmp:"
        df -h "{{ extract_dir }}"
        echo "Available memory:"
        free -m
      register: host_info
      changed_when: false

    - name: Display host information
      debug:
        var: host_info.stdout_lines

    # 4. ПРОВЕРЯЕМ НАЛИЧИЕ НЕОБХОДИМЫХ ПАКЕТОВ
    - name: Ensure required packages are installed
      raw: |
        missing_pkgs=""
        for cmd in rsync bzip2 tar; do
          if ! command -v $cmd >/dev/null 2>&1; then
            missing_pkgs="$missing_pkgs $cmd"
          fi
        done
        if ! command -v pass >/dev/null 2>&1; then
          echo "Installing pass..."
          sudo apt-get update && sudo apt install -y pass
        fi
        if [ -n "$missing_pkgs" ]; then
          echo "Installing missing packages: $missing_pkgs"
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y $missing_pkgs
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y $missing_pkgs
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y $missing_pkgs
          else
            echo "ERROR: Cannot install packages automatically: $missing_pkgs" >&2
            exit 1
          fi
        else
          echo "All required packages are already installed"
        fi
        
        # Проверяем установку bzip2 отдельно
        if command -v bzip2 >/dev/null 2>&1; then
          echo "bzip2 is installed: $(bzip2 --version 2>&1 | head -1)"
        else
          echo "ERROR: bzip2 not installed"
          exit 1
        fi

        if ! command -v dos2unix >/dev/null 2>&1; then
          echo "Installing dos2unix..."
          sudo apt-get update && sudo apt-get install -y dos2unix
        fi
      register: package_install
      changed_when: false
      become: yes
      when: inventory_hostname != jmeter_host

