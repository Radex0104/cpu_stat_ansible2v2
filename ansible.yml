    - name: Start RPLM.IP.Server process
      raw: |
        cd /opt/RPLM/
        if [ -f ./RPLM.IP.Server ]; then
          chmod +x ./RPLM.IP.Server
          echo "Starting RPLM.IP.Server..."
          nohup ./RPLM.IP.Server > /var/log/rplm_ip_server.log 2>&1 &
          sleep 2
          if pgrep -f RPLM.IP.Server > /dev/null; then
            echo "✅ RPLM.IP.Server started successfully (PID: $(pgrep -f RPLM.IP.Server))"
          else
            echo "❌ Failed to start RPLM.IP.Server"
            exit 1
          fi
        else
          echo "❌ RPLM.IP.Server not found in /opt/RPLM/"
          ls -la /opt/RPLM/
          exit 1
        fi
      register: rplm_start
      become: yes
      changed_when: false
      when: inventory_hostname != jmeter_host

# КОПИРОВАНИЕ JMETER АРХИВА (С ЛОКАЛЬНОЙ МАШИНЫ)
    - name: Copy JMeter archive to JMeter host
      shell: |
        JMETER_HOST="{{ jmeter_host }}"
        JMETER_USER="{{ hostvars[jmeter_host]['ansible_user'] }}"
        JMETER_PASSWORD="{{ hostvars[jmeter_host]['ansible_password'] }}"
        
        echo "Copying JMeter archive to $JMETER_HOST..."
        
        sshpass -p "$JMETER_PASSWORD" scp -o StrictHostKeyChecking=no \
          "{{ jmeter_archive_src }}" \
          $JMETER_USER@$JMETER_HOST:"/tmp/{{ jmeter_archive_src | basename }}"
        
        if [ $? -eq 0 ]; then
          echo "✅ JMeter archive copied"
        else
          exit 1
        fi
      delegate_to: localhost
      run_once: true
      when: jmeter_host is defined and jmeter_host != ""

    # РАСПАКОВКА JMETER АРХИВА
    - name: Extract JMeter archive
      raw: |
        ARCHIVE_FILE="/tmp/{{ jmeter_archive_src | basename }}"
        EXTRACT_DIR="{{ jmeter_remote_test_dir | default('/opt/jmeter_tests') }}"
        
        mkdir -p "$EXTRACT_DIR"
        
        # Устанавливаем unzip если нужно
        if ! command -v unzip >/dev/null 2>&1; then
          sudo apt-get update && sudo apt-get install -y unzip
        fi
        
        # Распаковываем ZIP архив
        unzip -o "$ARCHIVE_FILE" -d "$EXTRACT_DIR"
        
        if [ $? -eq 0 ]; then
          echo "✅ Extraction successful"
          ls -la "$EXTRACT_DIR"
        else
          exit 1
        fi
      delegate_to: "{{ jmeter_host }}"
      run_once: true
      become: yes
      when: jmeter_host is defined

