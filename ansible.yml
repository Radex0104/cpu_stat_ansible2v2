    # Получаем имена файлов из исходных путей
    
    archive_filename: "{{ archive_src | basename }}"

    # Пути на целевой машине
    archive_dest: "/tmp/{{ archive_filename }}"
    
    # Директория для распаковки (на одном уровне с архивом)
    extract_dir: "/tmp"
    
    result_dir: "/tmp/cpu_stat_results"
    
    # Параметры rsync
    rsync_extra_opts: '--partial --progress --compress --checksum'
    rsync_timeout: 3600

  tasks:
    # 0. ДОБАВЛЕНИЕ ХОСТА В KNOWN_HOSTS
    - name: Add host to known_hosts
      known_hosts:
        path: ~/.ssh/known_hosts
        name: "{{ inventory_hostname }}"
        key: "{{ lookup('pipe', 'ssh-keyscan ' + inventory_hostname) }}"
      delegate_to: localhost
      run_once: true
      when: ansible_user is defined
      ignore_errors: yes

    # 1. ТЕСТ СОЕДИНЕНИЯ
    - name: Gather basic host information
      raw: |
        echo "=== Host: $(hostname) ==="
        echo "IP: $(ip route get 1 | awk '{print $NF;exit}')"
        echo "Date: $(date)"
        echo "Free disk space on /tmp:"
        df -h "{{ extract_dir }}"
        echo "Available memory:"
        free -m
      register: host_info
      changed_when: false

    - name: Display host information
      debug:
        var: host_info.stdout_lines

