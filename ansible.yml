  # УСТАНОВКА СВЕЖЕЙ ВЕРСИИ JMETER
    - name: Install latest JMeter on JMeter host
      raw: |
        echo "=== Installing JMeter 5.6.3 on {{ jmeter_host }} ==="
        
        # Удаляем старую версию
        sudo apt-get remove -y jmeter || true
        
        # Устанавливаем Java
        if ! command -v java >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre-headless
        fi
        
        # Скачиваем JMeter
        cd /tmp
        if [ ! -f apache-jmeter-5.6.3.tgz ]; then
          wget -q --show-progress https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
        fi
        
        tar -xzf apache-jmeter-5.6.3.tgz
        sudo mv apache-jmeter-5.6.3 /opt/jmeter
        sudo ln -sf /opt/jmeter/bin/jmeter /usr/local/bin/jmeter
        
        echo "✅ JMeter 5.6.3 installed successfully"
        /usr/local/bin/jmeter --version 2>&1 | head -3
      delegate_to: "{{ jmeter_host }}"
      run_once: true
      become: yes
      when: jmeter_host is defined

    - name: Run JMeter test with target host label
      raw: |
        EXTRACT_DIR="{{ jmeter_remote_test_dir | default('/opt/jmeter_tests') }}"
        JMX_FILE=$(find "$EXTRACT_DIR" -name "*.jmx" -type f | head -1)
        RESULTS_DIR="{{ jmeter_results_remote_dir | default('/tmp/jmeter_results') }}"
        TEST_DURATION="{{ test_duration | default(300) }}"
        
        mkdir -p "$RESULTS_DIR"
        
        # Проверяем существование JMX файла
        if [ ! -f "$JMX_FILE" ]; then
          echo "❌ JMX file not found: $JMX_FILE"
          exit 1
        fi
        
        TARGET_HOSTS=""
        for host in {{ groups['webservers'] | join(' ') }}; do
          if [ "$host" != "{{ jmeter_host }}" ]; then
            TARGET_HOSTS="$TARGET_HOSTS $host"
          fi
        done
        
        for TARGET in $TARGET_HOSTS; do
          echo "=== Testing host: $TARGET ==="
          echo "Start time: $(date)"
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          RESULT_FILE="$RESULTS_DIR/result_${TARGET}_${TIMESTAMP}.jtl"
          
          # Запускаем тест (без sudo, так как become: yes уже делает от root)
          /usr/local/bin/jmeter -n \
            -t "$JMX_FILE" \
            -l "$RESULT_FILE" \
            -Jtarget_host=$TARGET \
            -Jfile_server=$TARGET \
            -Jurl=$TARGET \
            -Jurl1=$TARGET \
            -JDuration=$TEST_DURATION \
            -Jsample_variables=target_host
          
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 124 ]; then
            echo "✅ Test completed for $TARGET"
            echo "Results saved to: $RESULT_FILE"
            # Проверяем, что target_host записался
            echo "Last line target_host: $(tail -1 $RESULT_FILE | awk -F',' '{print $NF}')"
          else
            echo "❌ Test failed for $TARGET with exit code: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          
          echo "Finished at: $(date)"
          echo "---"
        done
      delegate_to: "{{ jmeter_host }}"
      run_once: true
      become: yes
      become_method: sudo
      become_flags: '-S'
      when: jmeter_host is defined
