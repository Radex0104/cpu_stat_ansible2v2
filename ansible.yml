 # СОЗДАНИЕ SYSTEMD СЕРВИСА ДЛЯ RPLM
    - name: Create RPLM systemd service
      raw: |
        sudo tee /etc/systemd/system/rplm-ip.service << 'EOF'
        [Unit]
        Description=RPLM IP Server
        After=network.target
        
        [Service]
        Type=simple
        User=root
        WorkingDirectory=/opt/RPLM
        ExecStart=/opt/RPLM/RPLM.IP.Server
        Restart=always
        RestartSec=5
        StandardOutput=append:/var/log/rplm_ip_server.log
        StandardError=append:/var/log/rplm_ip_server.log
        
        [Install]
        WantedBy=multi-user.target
        EOF
        
        sudo systemctl daemon-reload
        sudo systemctl enable rplm-ip
        sudo systemctl start rplm-ip
        
        sleep 3
        sudo systemctl status rplm-ip --no-pager
      become: yes
      when: inventory_hostname != jmeter_host

