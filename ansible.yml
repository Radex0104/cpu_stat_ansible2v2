    archive_filename: "{{ archive_src | basename }}"
    archive_dest: "{{ extract_dir }}/{{ archive_filename }}"
    result_dir: "{{ extract_dir }}/cpu_stat_results"
    rsync_extra_opts: '--partial --progress --compress --checksum'
    rsync_timeout: 3600
    host_deployment_success: false

